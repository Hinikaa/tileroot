name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y nlohmann-json3-dev libx11-dev

      - name: Run test suite
        run: make test

      - name: Build binary
        run: make tileroot

      - name: Smoke test
        run: |
          ./tileroot --version
          ./tileroot --help
